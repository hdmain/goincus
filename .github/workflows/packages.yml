name: packages

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go test ./...

  build-binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - goarch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "dist/goincus-linux-${{ matrix.goarch }}" \
            ./cmd/goincus

      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
          chmod +x packaging/build-deb.sh packaging/build-rpm.sh
          bash packaging/build-deb.sh \
            "${{ steps.ver.outputs.version }}" \
            "${{ matrix.deb_arch }}" \
            "dist/goincus-linux-${{ matrix.goarch }}" \
            dist
          # rpmbuild on ubuntu-amd64 cannot target aarch64.
          if [ "${{ matrix.rpm_arch }}" = "x86_64" ]; then
            bash packaging/build-rpm.sh \
              "${{ steps.ver.outputs.version }}" \
              "${{ matrix.rpm_arch }}" \
              "dist/goincus-linux-${{ matrix.goarch }}" \
              dist
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pkgs-${{ matrix.goarch }}
          path: |
            dist/goincus-linux-${{ matrix.goarch }}
            dist/*.deb
            dist/*.rpm

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/goincus-linux-amd64
            artifacts/goincus-linux-arm64
            artifacts/*.deb
            artifacts/*.rpm
          generate_release_notes: true

      - name: Prepare gh-pages worktree
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages \
            || mkdir -p gh-pages
          if [ ! -d gh-pages/.git ]; then
            cd gh-pages
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout -b gh-pages
          fi

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c

      - name: Publish apt and rpm repos
        run: |
          mkdir -p gh-pages/pool/main gh-pages/rpm
          cp artifacts/*.deb gh-pages/pool/main/
          cp artifacts/*.rpm gh-pages/rpm/ || true
          cp src/packaging/index.html gh-pages/index.html
          cd gh-pages
          dpkg-scanpackages --multiversion pool/ > Packages
          gzip -k -f Packages
          # Silence apt Translation-en 404 noise for this flat repo.
          : > Translation-en
          gzip -k -f Translation-en
          printf '%s\n' \
            'Origin: goincus' \
            'Label: goincus' \
            'Suite: stable' \
            'Codename: stable' \
            'Architectures: amd64 arm64' \
            'Components: main' \
            'Description: goincus packages' \
            > Release
          if ls rpm/*.rpm >/dev/null 2>&1; then
            createrepo_c rpm
          fi

      - name: Push gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "packages: deb rpm"
          git push -u origin HEAD:gh-pages --force
